# Build podpisanego AAB (Android App Bundle) dla Google Play — spec 2026-07-13.
#
# Ręczne uruchomienie (gh workflow run android.yml). Artifact: SeaSteps-aab.
# Lokalnie nie ma Javy/Android SDK — jedyna ścieżka builda to ten workflow.
#
# Sekrety: ANDROID_KEYSTORE_B64 (PKCS12, alias `upload`), ANDROID_KEYSTORE_PASS.
# Zmienne (vars): VITE_API_BASE, VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY —
# wartości publiczne (i tak są w bundlu przeglądarkowym), wpięte przy buildzie.
name: android

on:
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build web bundle (base=/) and sync Capacitor
        working-directory: web
        env:
          VITE_BASE: /
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
          # index.html hardkoduje /app/ dla favicon/manifest (deploy webowy);
          # w natywnym webview bundle stoi w rootcie.
          sed -i 's| href="/app/| href="/|g' dist/index.html
          npx cap sync android

      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.p12"

      - name: Upload key SHA-256 fingerprint (public) for assetlinks.json
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          # odcisk certyfikatu jest publiczny; do logu trafiaja wylacznie linie SHA256:
          FP=$(keytool -list -v -alias upload -keystore "$RUNNER_TEMP/upload-keystore.p12" -storetype PKCS12 -storepass "$KEYSTORE_PASS" 2>/dev/null | grep -E '^\s*SHA256:' | head -1 | sed -E 's/^\s*SHA256:\s*//')
          echo "Upload key SHA256: $FP"
          test -n "$FP"
          cat > assetlinks.json <<JSON
          [{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"pl.seasteps.app","sha256_cert_fingerprints":["$FP"]}}]
          JSON
          sed -i 's/^ *//' assetlinks.json

      - name: Gradle bundleRelease (signed)
        working-directory: web/android
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease \
            -PversionCode=${{ github.run_number }} \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload-keystore.p12" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASS" \
            -Pandroid.injected.signing.key.alias=upload \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASS"

      - name: Rename artifact
        run: cp web/android/app/build/outputs/bundle/release/app-release.aab SeaSteps.aab

      - name: Dump merged manifest (targetSdk, permissions)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" \
            https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle SeaSteps.aab > "$RUNNER_TEMP/manifest.xml"
          echo "=== versionCode / versionName / targetSdk / minSdk ==="
          grep -E 'versionCode|versionName|targetSdkVersion|minSdkVersion|allowBackup' "$RUNNER_TEMP/manifest.xml" || true
          echo "=== uses-permission ==="
          grep -E 'uses-permission' -A0 "$RUNNER_TEMP/manifest.xml" | sed 's/^ *//' || true
          if grep -q 'ACCESS_BACKGROUND_LOCATION' "$RUNNER_TEMP/manifest.xml"; then
            echo "::error::ACCESS_BACKGROUND_LOCATION w manifescie AAB"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: SeaSteps-aab
          path: SeaSteps.aab
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: assetlinks
          path: assetlinks.json
          retention-days: 30
